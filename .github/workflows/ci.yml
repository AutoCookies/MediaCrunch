name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install native dependencies
        run: sudo apt update && sudo apt install -y build-essential pkg-config libwebp-dev libjpeg-dev libpng-dev
      - name: Run CI
        run: make ci
